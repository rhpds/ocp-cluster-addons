# Default values for rhoai.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Set to empty to NOT install the Operator
# operator: ''
operator:
  name: rhods-operator
  namespace: redhat-ods-operator
  channel: stable
  installPlanApproval: Automatic
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  # startingCSV: rhods-operator.x.y.x
  # Set to true to render a Sync-phase hook Job that approves the pending
  # InstallPlan for this Subscription. Only needed/used when
  # installPlanApproval is Manual. See templates/installplan-approver.yaml.
  autoApprove: false

# Set to empty to NOT install DSCInitialization
dscinitialization: ''
# dscinitialization:
#   name: default-dsci
#   serviceMesh:
#     managementState: Removed

# Set to empty to NOT install DataScienceCluster
# datasciencecluster: ''
datasciencecluster:
  name: default-dsc
  apiVersion: datasciencecluster.opendatahub.io/v1
  components:
    aipipelines:
      argoWorkflowsControllers:
        managementState: Removed 
      managementState: Removed
    dashboard:
      managementState: Removed
    feastoperator:
      managementState: Removed
    kserve:
      managementState: Removed
    kueue:
      managementState: Removed
    llamastackoperator:
      managementState: Removed
    modelregistry:
      managementState: Removed
    ray:
      managementState: Removed
    trainingoperator:
      managementState: Removed
    trustyai:
      managementState: Removed
    workbenches:
      managementState: Removed

patcher:
  name: rhoai-patcher
  namespace: redhat-ods-applications
  syncwave: "0"
  # NOTE: was registry.redhat.io/openshift4/ose-cli (no tag). That repo now
  # rejects `:latest` pulls, causing permanent ImagePullBackOff. The in-cluster
  # openshift/tools imagestream is always present and always pullable,
  # regardless of OCP version.
  image: image-registry.openshift-image-registry.svc:5000/openshift/tools:latest
  # route: true
  # dashboard:
  #   replicas: 1

# Using sub-chart helper-status-checker
# NOTE: disabled by default. Its Jobs also hardcode the now-broken
# registry.redhat.io/openshift4/ose-cli (no tag) image with no values override
# available in any released chart version (checked through 4.0.21), so they
# permanently ImagePullBackOff. Use operator.autoApprove above instead of
# helper-status-checker.approver for InstallPlan approval.
helper-status-checker:
  enabled: false
  approver: false
  checks:
    - operatorName: rhods-operator
      namespace:
        name: redhat-ods-operator
      syncwave: '1'
      serviceAccount:
        name: "rhoai-status-checker"
